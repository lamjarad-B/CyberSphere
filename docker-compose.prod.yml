# Déploiement de production : reverse proxy TLS + application + base de
# données + sauvegardes chiffrées.
# Usage :
#   cp .env.production.example .env.production   (puis renseigner les secrets)
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

services:
  # Reverse proxy : TLS automatique (Let's Encrypt) + HSTS.
  # Seul service exposé sur Internet.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      SECURITY_CONTACT: ${SECURITY_CONTACT}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    # Plus de port publié : le trafic passe par Caddy sur le réseau interne
    expose:
      - "3000"
    volumes:
      - uploads:/app/uploads

  # Sauvegarde quotidienne : pg_dump compressé puis chiffré (AES-256),
  # rotation sur BACKUP_KEEP_DAYS jours. Restauration :
  #   openssl enc -d -aes-256-cbc -pbkdf2 -pass env:BACKUP_PASSPHRASE \
  #     -in fichier.sql.gz.enc | gunzip | psql …
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - db-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date +%Y-%m-%d_%H%M)
          echo "→ Sauvegarde $$stamp"
          if pg_dump | gzip | openssl enc -aes-256-cbc -pbkdf2 \
              -pass env:BACKUP_PASSPHRASE \
              -out "/backups/cybersphere_$$stamp.sql.gz.enc"; then
            echo "✓ /backups/cybersphere_$$stamp.sql.gz.enc"
          else
            echo "✗ Échec de la sauvegarde" >&2
          fi
          find /backups -name '*.enc' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  db-data:
  db-backups:
  uploads:
  caddy-data:
  caddy-config:
