services:
  db:
    image: postgres:17-alpine
    container_name: cybersphere-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cybersphere
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?définissez POSTGRES_PASSWORD dans .env}"
      POSTGRES_DB: cybersphere
    ports:
      # Port hôte configurable (POSTGRES_PORT) si 5433 est déjà pris.
      # Lié à 127.0.0.1 : sans cela, Docker publie la base sur toutes les
      # interfaces (Wi-Fi public, réseau local) en contournant le pare-feu.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersphere -d cybersphere"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db-data:
