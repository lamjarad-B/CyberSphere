<svg xmlns="http://www.w3.org/2000/svg" width="768" height="520" viewBox="0 0 768 520" role="img" aria-labelledby="t1">
  <title id="t1">Calendrier de signalement d'un incident significatif sous NIS2</title>
  <rect width="768" height="520" rx="14" fill="#0f1622" stroke="#1e293b" stroke-width="1.5"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="32" y="48" font-size="24" font-weight="600" fill="#e6edf3">Signaler un incident significatif</text>
    <text x="32" y="76" font-size="15" fill="#8b98a9">Directive (UE) 2022/2555, article 23</text>

    <line x1="150" y1="118" x2="150" y2="322" stroke="#334155" stroke-width="3"/>

    <circle cx="150" cy="118" r="8" fill="#0f1622" stroke="#8b98a9" stroke-width="3"/>
    <text x="174" y="124" font-size="16" font-weight="600" fill="#8b98a9">Prise de connaissance</text>

    <circle cx="150" cy="170" r="9" fill="#22d3ee"/>
    <circle cx="150" cy="244" r="9" fill="#22d3ee"/>
    <circle cx="150" cy="318" r="9" fill="#22d3ee"/>

    <g font-size="19" font-weight="700" fill="#22d3ee" text-anchor="end">
      <text x="128" y="177">24 heures</text>
      <text x="128" y="251">72 heures</text>
      <text x="128" y="325">1 mois</text>
    </g>

    <text x="174" y="177" font-size="18" font-weight="600" fill="#e6edf3">Alerte précoce</text>
    <text x="174" y="201" font-size="15" fill="#8b98a9">Acte malveillant suspecté ? Impact transfrontalier possible ?</text>

    <text x="174" y="251" font-size="18" font-weight="600" fill="#e6edf3">Notification</text>
    <text x="174" y="275" font-size="15" fill="#8b98a9">Première évaluation de la gravité. Indicateurs de compromission.</text>

    <text x="174" y="325" font-size="18" font-weight="600" fill="#e6edf3">Rapport final</text>
    <text x="174" y="349" font-size="15" fill="#8b98a9">
      <tspan x="174">Cause première, mesures appliquées, effets.</tspan>
      <tspan x="174" dy="21">Compté depuis la notification.</tspan>
    </text>

    <line x1="32" y1="392" x2="736" y2="392" stroke="#1e293b" stroke-width="1.5"/>
    <g font-size="14" fill="#8b98a9">
      <text x="32" y="418">Les 24 et 72 heures courent depuis la prise de connaissance ; le mois court depuis</text>
      <text x="32" y="438">la notification des 72 heures, non depuis l'incident.</text>
      <text x="32" y="466">Les prestataires de services de confiance notifient en 24 heures au lieu de 72.</text>
      <text x="32" y="494">Si l'incident est encore en cours, le rapport final devient un rapport d'avancement.</text>
    </g>
  </g>
</svg>
