<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="tfc">
  <title id="tfc">La chaîne du froid comme cible : 12 976 services de pilotage frigorifique joignables depuis Internet dans 99 pays</title>
  <defs>
    <linearGradient id="bgf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1622"/>
    </linearGradient>
    <radialGradient id="glowf" cx="0.88" cy="0.1" r="0.95">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridf" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgf)"/>
  <rect width="1200" height="630" fill="url(#gridf)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glowf)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="72" y="40" width="7" height="88" rx="3.5" fill="#22d3ee"/>
    <text x="104" y="90" font-size="54" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">La chaîne du froid</text>
    <text x="104" y="126" font-size="25" fill="#8b98a9">Des supermarchés aux banques de sang</text>

    <g>
      <rect x="72" y="156" width="336" height="194" rx="14" fill="#0d1526" stroke="#1e293b" stroke-width="1.5"/>
      <text x="100" y="222" font-size="58" font-weight="700" fill="#22d3ee">12 976</text>
      <text x="100" y="258" font-size="22" fill="#8b98a9">
        <tspan x="100">services de pilotage</tspan>
        <tspan x="100" dy="28">frigorifique joignables</tspan>
        <tspan x="100" dy="28">depuis Internet</tspan>
      </text>
    </g>

    <g>
      <rect x="432" y="156" width="336" height="194" rx="14" fill="#0d1526" stroke="#1e293b" stroke-width="1.5"/>
      <text x="460" y="222" font-size="58" font-weight="700" fill="#22d3ee">99</text>
      <text x="460" y="258" font-size="22" fill="#8b98a9">
        <tspan x="460">pays et territoires</tspan>
        <tspan x="460" dy="28">où ces équipements</tspan>
        <tspan x="460" dy="28">sont exposés</tspan>
      </text>
    </g>

    <g>
      <rect x="792" y="156" width="336" height="194" rx="14" fill="#2a1f07" stroke="#f59e0b" stroke-width="2"/>
      <text x="820" y="222" font-size="58" font-weight="700" fill="#f59e0b">11</text>
      <text x="820" y="258" font-size="22" fill="#cbd5e1">
        <tspan x="820">pays au moins</tspan>
        <tspan x="820" dy="28">touchés par la vague</tspan>
        <tspan x="820" dy="28">du 2 novembre</tspan>
      </text>
    </g>

    <g font-size="22" fill="#8b98a9">
      <text x="72" y="386">Exposition mesurée par Forescout le 22 octobre 2026.</text>
      <text x="72" y="414">Incidents recensés par Euronews le 3 novembre 2026.</text>
    </g>

    <line x1="110" y1="494" x2="1050" y2="494" stroke="#1e293b" stroke-width="3"/>
    <circle cx="110" cy="494" r="10" fill="#22d3ee"/>
    <circle cx="437" cy="494" r="10" fill="#f59e0b"/>
    <circle cx="764" cy="494" r="10" fill="#22d3ee"/>
    <circle cx="1050" cy="494" r="10" fill="#22d3ee"/>

    <g font-size="22" font-weight="700">
      <text x="110" y="470" fill="#22d3ee" text-anchor="middle">11-12 oct.</text>
      <text x="437" y="470" fill="#f59e0b" text-anchor="middle">21 oct.</text>
      <text x="764" y="470" fill="#22d3ee" text-anchor="middle">1-2 nov.</text>
      <text x="1050" y="470" fill="#22d3ee" text-anchor="middle">2 nov.</text>
    </g>

    <g font-size="22" fill="#8b98a9">
      <text x="110" y="536" text-anchor="middle">Centaines de</text>
      <text x="110" y="564" text-anchor="middle">supermarchés</text>
      <text x="437" y="536" text-anchor="middle">L'ANSSI désigne</text>
      <text x="437" y="564" text-anchor="middle">la santé</text>
      <text x="764" y="536" text-anchor="middle">Prestataire</text>
      <text x="764" y="564" text-anchor="middle">de l'EFS</text>
      <text x="1050" y="536" text-anchor="middle">Belgique, Suède,</text>
      <text x="1050" y="564" text-anchor="middle">Italie, Roumanie…</text>
    </g>
  </g>
</svg>
