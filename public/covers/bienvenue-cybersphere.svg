<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CyberSphere">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1622"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Terminal window -->
  <g transform="translate(210 150)">
    <rect x="0" y="0" width="780" height="330" rx="16" fill="#0d1526" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="780" height="46" rx="16" fill="#111c31"/>
    <rect x="0" y="30" width="780" height="16" fill="#111c31"/>
    <circle cx="26" cy="23" r="6" fill="#ef4444"/>
    <circle cx="48" cy="23" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="23" r="6" fill="#22c55e"/>
    <text x="390" y="28" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#64748b">cybersphere — bash</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22">
      <text x="34" y="104" fill="#22d3ee">$ whoami --blog</text>
      <text x="34" y="140" fill="#e2e8f0">CyberSphere</text>
      <text x="34" y="188" fill="#22d3ee">$ cat mission.txt</text>
      <text x="34" y="224" fill="#94a3b8">pentest · défense · cryptographie · veille</text>
      <text x="34" y="286" fill="#22d3ee">$ ./bienvenue.sh</text>
      <text x="196" y="286" fill="#e2e8f0">Bienvenue<tspan fill="#22d3ee"> _</tspan></text>
    </g>
  </g>
</svg>
