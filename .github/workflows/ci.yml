name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build
        env:
          # Valeurs factices : le build ne se connecte pas à la base
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-secret-inutilisable-en-production
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  e2e:
    name: Tests de bout en bout (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cybersphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cybersphere"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/cybersphere
      BETTER_AUTH_SECRET: ci-secret-e2e-inutilisable-en-production
      BETTER_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      ADMIN_EMAIL: admin@cybersphere.test
      # Pas de DISABLE_SCHEDULER : un parcours vérifie la publication programmée
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Base de test (migrations + seed)
        run: |
          npx prisma migrate deploy
          # Mot de passe admin aléatoire : jamais présent dans Have I Been Pwned
          ADMIN_PASSWORD="$(openssl rand -base64 24)" npm run db:seed

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Parcours de bout en bout
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Échoue sur toute vulnérabilité high/critical connue
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Déploiement en production
    # Uniquement sur un push vers main, et seulement si tout le reste est vert
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-build, e2e, audit, secrets]
    runs-on: ubuntu-latest
    environment: production
    # Un seul déploiement à la fois ; un push récent n'annule pas celui en cours
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # ssh natif plutôt qu'une action tierce : la clé de prod ne transite
      # par aucun code extérieur au dépôt
      - name: Configurer SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Empreinte du serveur épinglée : pas de confiance au premier contact
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Mettre à jour et reconstruire sur le serveur
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" <<'EOF'
          set -euo pipefail
          cd "$1"
          git fetch --quiet origin main
          # Déploie exactement le commit testé ; refuse si le serveur a divergé
          git merge --ff-only "$2"
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
          docker image prune -f
          EOF

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key
